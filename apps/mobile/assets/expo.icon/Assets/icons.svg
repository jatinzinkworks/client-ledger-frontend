<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 356 182" width="356" height="182" role="img" aria-label="PSC CA verified badge" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
